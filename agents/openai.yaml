interface:
  display_name: "Photo to Comic 照片漫画"
  short_description: "把一张照片生成多机位手绘动画漫画组图"
  default_prompt: "Use $photo-to-comic to turn my photo into one exact portrait 2:3 comic page with at least three visibly divided panels and three shot scales. Treat the photo as semantic story evidence rather than a locked composition or pose; choose level, low, high, side, reverse, or object-level cameras only when they improve narrative or beauty. Render every panel as a visibly hand-painted animation image—not clean digital cel anime—with interlocking opaque paint masses, unequal colour turns, connected directional strokes, shared boundary light, lost-and-found edges, and a source-specific Material Paint Proof Map. Preserve motif continuity and face identity proportions while keeping one shared painterly completion family across the page."
