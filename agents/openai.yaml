interface:
  display_name: "Photo to Comic 照片漫画"
  short_description: "用一张照片生成多机位绘画感2:3漫画组图"
  default_prompt: "Use $photo-to-comic to turn my photo into one exact portrait 2:3 comic page with at least three visibly divided panels and three shot scales. Treat the photo as semantic story evidence rather than a locked composition or pose; choose level, low, high, side, reverse, or object-level cameras only when they improve narrative or beauty. Keep motif continuity, face identity proportions, and one shared painterly colour, plane, brush, material, and edge system across every panel."
